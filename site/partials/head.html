<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{langDetect}}
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="keywords" content="{{keywords}}">
<meta name="author" content="nabre and the Strix contributors">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{base}}{{path}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Strix">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{base}}{{path}}">
<meta property="og:image" content="{{base}}assets/social.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="{{socialAlt}}">
{{ogLocales}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base}}assets/social.png">
<link rel="icon" type="image/svg+xml" href="{{root}}assets/strix.svg">
<link rel="apple-touch-icon" href="{{root}}assets/strix-256.png">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script type="application/ld+json">{{jsonLd}}</script>
