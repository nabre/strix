<a class="skip" href="#top">{{skipToContent}}</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="{{root}}{{langPath}}" aria-label="{{homeLabel}}">
      <img class="brand-symbol" src="{{root}}assets/strix.svg" alt="" width="30" height="30">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="{{root}}assets/wordmark-dark.svg">
        <img class="brand-word" src="{{root}}assets/wordmark-light.svg" alt="Strix" width="72" height="24">
      </picture>
    </a>
    <nav class="nav" aria-label="{{navLabel}}">
      <a href="{{home}}#math">{{navMath}}</a>
      <a href="{{home}}#features">{{navFeatures}}</a>
      <a href="{{home}}#exercises">{{navExercises}}</a>
      <a href="{{home}}#cad">{{navCad}}</a>
      <a href="{{home}}#agents">{{navAgents}}</a>
    </nav>
    <div class="top-actions">
      {{langLinks}}
      <a class="gh" href="https://github.com/nabre/strix">GitHub</a>
      <a class="btn btn-primary btn-small" href="{{home}}#download">{{navDownload}}</a>
    </div>
  </div>
</header>
