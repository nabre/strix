name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions. A push to main whose code a PR already
# passed doesn't run them again (tested-tree.yml); a draft PR, or one that changes only
# documentation, doesn't run them at all (pr-scope.yml).
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft's checks run when it is marked ready (pr-scope.yml).
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly on main, for the dependency caches only main's runs save: skipped when main has no
  # new code since its last full run (tested-tree.yml).
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Already passed on the PR that brought this exact code to main: not run again (tested-tree.yml).
  tested:
    uses: ./.github/workflows/tested-tree.yml
    permissions:
      contents: read
      actions: read
    with:
      workflow: ci.yml
      mode: check

  # A draft PR, or one that changes only documentation: not run (pr-scope.yml).
  scope:
    uses: ./.github/workflows/pr-scope.yml
    permissions:
      contents: read
      pull-requests: read

  gate:
    needs: [tested, scope]
    if: needs.tested.outputs.tested != 'true' && needs.scope.outputs.run != 'false'
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

  # Checks passed on a PR or on main: remember the tree (tested-tree.yml).
  record:
    needs: [gate]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tested-tree.yml
    permissions:
      contents: read
      actions: read
    with:
      workflow: ci.yml
      mode: record
