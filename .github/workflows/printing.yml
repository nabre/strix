# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
# Exercise the native print host and all UI tests on PRs; the broad FreeBSD/ARM64 gates
# stay on their existing nightly/release schedule. Linux is left to ci.yml, whose
# `cargo xtask ci` already runs fmt, workspace clippy and tests, and the wasm check: here only
# the macOS and Windows hosts compile, without repeating what doesn't depend on the OS.
name: Printing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/strix/**'
      - 'apps/strix-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'apps/strix/**'
      - 'apps/strix-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Print (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Native app and UI Clippy
        run: cargo clippy -p strix -p wordcraft-ui-egui --all-targets --locked -- -D warnings

      - name: Native app and UI tests
        run: cargo test -p strix -p wordcraft-ui-egui --locked
