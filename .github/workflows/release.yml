# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
# Strix's one release workflow (docs/releasing.md). Signed packages are built only on the `release`
# branch: the `release` environment gives its signing secrets to that branch alone, and SignPath
# signs only requests from the Release workflow on `release` (docs/code-signing.md).
#
# Step 3 of the release flow (docs/releasing.md, "The release flow"): a push to main whose version
# has no release is merged into `release` by promote.yml, which starts this workflow there; the
# site (site.yml) follows it.
#
# - Push to release (by promote.yml, or by hand: merge main into release): when the version in
#   Cargo.toml ([workspace.package] version) has no published GitHub Release `vX.Y.Z`, every
#   platform's packages are built, and the release is published with all of them, SHA256SUMS.txt
#   and generated notes; then the site (site.yml) is redeployed so its download links and web app
#   move to it. Otherwise nothing runs past "Version".
# - Run by hand on any other branch but main: every package built as a dry run, nothing published.
#   On main it does nothing: main is released through promote.yml.
#
# Its jobs run in five phases, numbered in their names so the graph and the job list read in order:
#   1 Version: what this run does.
#   2 Preflight, what decides for every platform: "Checks already run" (the released code's CI
#     passed: fails the run otherwise, before any build) and "Signing" (what will be signed: a
#     report that never fails the run).
#   3 The builds, one per platform, all at once once both preflight jobs have ended.
#   4 Flatpak and Arch Linux, made from the Linux tarballs.
#   5 Publish, once every build has passed.
#
# Every platform builds whether or not the signing secrets are set: the "Signing" job reports what
# is missing as warnings, never as a failure, and the macOS and Windows packaging scripts then sign
# ad hoc or not at all.
#
# Nothing checked elsewhere is run again here (job "Checks already run"): CI (`cargo xtask ci`,
# ci.yml) of the main commit released must pass, and the last nightly FreeBSD and Windows ARM64
# runs on main (freebsd.yml, windows-arm64.yml) are reported.
#
# It reuses the suite's composite actions (storytold/craft-common-actions/actions/*) but not its
# reusable release workflow, which runs macOS on a paid macos-15-xlarge runner.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, never cancelled: a push to release made while a release is building
# (promote.yml merging a newer main) waits, then finds the release published and stops at "Version".
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same craft-fonts commit as ci.yml.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Phase 1. What this run does, decided once; every other job follows its outputs.
  # - version: Cargo.toml's [workspace.package] version; tag v<version>.
  # - build: on release, v<version> has no published release; on another branch (not main), a
  #   dry run.
  # - publish: on release only.
  # - sha: the commit built: this one, or the tag's when v<version> was tagged without a release
  #   (the release must hold what the tag names).
  version:
    name: 1 · Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # [workspace.package] version of a Cargo.toml read on stdin.
          version_of() { awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }'; }
          version="$(version_of <Cargo.toml)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml's [workspace.package]"; exit 1; }
          tag="v$version"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          sha="$GITHUB_SHA"
          build=false
          publish=false
          echo "### Release" >>"$GITHUB_STEP_SUMMARY"
          released=false
          [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ] && released=true
          case "$GITHUB_REF" in
            refs/heads/main)
              echo "main is released through Promote (promote.yml), which merges it into release and starts this workflow there: nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            refs/heads/release)
              if [ "$released" = true ]; then
                echo "$tag is already released: nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
              elif tagged="$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null)" && [ -n "$tagged" ]; then
                # Tagged without a release: build what the tag names, if it carries this version.
                at_tag="$(gh api "repos/$repo/contents/Cargo.toml?ref=$tagged" --jq .content | base64 -d | version_of)"
                if [ "$at_tag" != "$version" ]; then
                  echo "::error::tag $tag points at ${tagged:0:7}, whose Cargo.toml says $at_tag: move or delete the tag, or bump the version"
                  exit 1
                fi
                sha="$tagged"
                build=true
                publish=true
                echo "$tag is tagged (${tagged:0:7}) but not released: building and publishing it" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                build=true
                publish=true
                echo "$tag has no release: building and publishing it from ${sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              build=true
              echo "Dry run on $GITHUB_REF_NAME: every package of $version is built, nothing is published" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          {
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$prerelease"
            echo "sha=$sha"
            echo "build=$build"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
      # Where this run sits in the release flow: the diagram of docs/releasing.md, the jobs this run
      # goes through marked.
      - name: Show the release flow
        env:
          BUILD: ${{ steps.v.outputs.build }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          nodes=(version)
          [ "$BUILD" = true ] && nodes+=(checks signing builds linuxpkgs)
          [ "$PUBLISH" = true ] && nodes+=(publish)
          bash .github/release-flow.sh "${nodes[@]}" >>"$GITHUB_STEP_SUMMARY"

  # Phase 2 (preflight). What other workflows already checked, read instead of run again. Every
  # build waits for it, so a release whose code failed CI builds nothing:
  # - CI (ci.yml, `cargo xtask ci`) of the released code: the built commit's run or, when the
  #   release branch got main through a merge commit, the run of the main commit merged in (its
  #   second parent). Waited for while it runs. Failed: this job fails, and nothing is built or
  #   published. Not found: a warning. In a dry run (nothing published) it only reports: a failed
  #   or unfinished CI is a warning, not waited for, and the packages are still built.
  # - The last completed nightly FreeBSD and Windows ARM64 runs on main: reported, a warning when
  #   one failed (they don't hold the release back).
  checks:
    name: 2 · Checks already run
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: CI of the released code
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.version.outputs.sha }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # "id status url conclusion" of the commit's CI run, nothing without one (the conclusion
          # last: it is empty while the run goes on).
          run_of() {
            gh run list --repo "$repo" --workflow ci.yml --commit "$1" --limit 1 \
              --json databaseId,status,url,conclusion --jq '.[] | "\(.databaseId) \(.status) \(.url) \(.conclusion)"'
          }
          checked="$SHA"
          run="$(run_of "$checked")"
          if [ -z "$run" ]; then
            # A merge commit on release: the main commit merged in (second parent) had the CI run.
            merged="$(gh api "repos/$repo/commits/$SHA" --jq '.parents[1].sha // empty')"
            if [ -n "$merged" ]; then
              checked="$merged"
              run="$(run_of "$checked")"
            fi
          fi
          echo "### Checks already run" >>"$GITHUB_STEP_SUMMARY"
          if [ -z "$run" ]; then
            echo "::warning::no CI run (ci.yml) for $checked: the released code's cargo xtask ci can't be confirmed"
            echo "- CI: no run found for $checked" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r id status url conclusion <<<"$run"
          if [ "$status" != completed ] && [ "$PUBLISH" != true ]; then
            echo "::warning::dry run: CI run $id for $checked is still running, not waited for: $url"
            echo "- CI on $checked: still running, not waited for in a dry run ($url)" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != completed ]; then
            echo "CI run $id for $checked is still running: waiting for it"
            gh run watch "$id" --repo "$repo" --interval 60 >/dev/null || true
            conclusion="$(gh run view "$id" --repo "$repo" --json conclusion --jq .conclusion)"
          fi
          echo "- CI on $checked: $conclusion ($url)" >>"$GITHUB_STEP_SUMMARY"
          if [ "$conclusion" != success ]; then
            if [ "$PUBLISH" != true ]; then
              echo "::warning::dry run: CI (ci.yml) on $checked ended \"$conclusion\": $url (a release would stop here)"
              exit 0
            fi
            echo "::error::CI (ci.yml) on $checked ended \"$conclusion\": $url (nothing is built or published; fix it on main: the next push to main brings the fix into release)"
            exit 1
          fi
      - name: Last nightly FreeBSD and Windows ARM64 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in freebsd.yml windows-arm64.yml; do
            last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --status completed --limit 1 \
              --json conclusion,headSha,createdAt,url --jq '.[] | "\(.conclusion) \(.headSha) \(.createdAt) \(.url)"')"
            if [ -z "$last" ]; then
              echo "::warning::$wf: no completed run on main yet"
              echo "- $wf: no completed run on main" >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            read -r conclusion sha when url <<<"$last"
            echo "- $wf: $conclusion on ${sha:0:7} ($when, $url)" >>"$GITHUB_STEP_SUMMARY"
            if [ "$conclusion" != success ]; then
              echo "::warning::$wf: the last run on main (${sha:0:7}, $when) ended \"$conclusion\": $url"
            fi
          done

  # Phase 2 (preflight). Which signing secrets are set: a report, never a failure. Unsigned packages
  # still ship. The builds wait for it but don't need it to pass: in a dry run the `release`
  # environment refuses this job (and the macOS and Windows builds), and the other builds go on.
  signing:
    name: 2 · Signing (check only)
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - name: Report the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          set -u
          note() { echo "::warning::$1"; echo "- $1" >>"$GITHUB_STEP_SUMMARY"; }
          echo "### Signing" >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$APPLE_CERTIFICATE" ]; then
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "- macOS: signed and notarized" >>"$GITHUB_STEP_SUMMARY"
            else
              note "macOS: signed with the Developer ID but not notarized (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID missing)"
            fi
          else
            note "macOS: ad-hoc signed, not notarized (no APPLE_CERTIFICATE): Gatekeeper will ask users to allow the app"
          fi
          azure=1
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            [ -n "${!name}" ] || azure=0
          done
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "- Windows: signed through SignPath Foundation (each release waits for approval in SignPath)" >>"$GITHUB_STEP_SUMMARY"
          elif [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "- Windows: signed with WINDOWS_CERTIFICATE" >>"$GITHUB_STEP_SUMMARY"
          elif [ "$azure" = 1 ]; then
            echo "- Windows: signed with Azure Trusted Signing" >>"$GITHUB_STEP_SUMMARY"
          else
            note "Windows: unsigned (no WINDOWS_CERTIFICATE pair nor the six AZURE_* secrets): SmartScreen will warn users"
          fi

  # Phase 3. One build per platform, all at once once the preflight has ended: macOS, Windows,
  # Linux, Linux riscv64, Web and FreeBSD (the Linux tarballs then feed phase 4).
  macos:
    name: 3 · macOS universal
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    # The standard (free) Apple silicon runner; it builds the x86_64 half too.
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    env:
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos-universal
      # Without the certificate it warns and leaves ad-hoc signing to package.sh.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: 3 · Windows ${{ matrix.arch }}
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
      # SignPath Foundation signing (docs/code-signing.md): on when the API token is set.
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-${{ matrix.arch }}
      - uses: storytold/craft-common-actions/actions/install-wix@main
      # sign.ps1 skips signing with a warning when no secret is set.
      - name: Build, sign and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      # With SignPath, package.ps1 left everything unsigned (no other signing secret is set then):
      # SignPath signs the programs inside the installers and the zip, then the installers and the
      # portable exe (.signpath/artifact-configuration.xml), after an Approver accepts the request.
      - name: Upload the unsigned packages for SignPath
        id: unsigned
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - name: Sign through SignPath
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: strix
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.WORDCRAFT_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist/signed
      - name: Use the signed packages
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          Remove-Item dist/release/* -Force
          Copy-Item dist/signed/* dist/release/
          Get-AuthenticodeSignature dist/release/*.msi, dist/release/*.exe | Format-Table Status, Path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: 3 · Linux ${{ matrix.arch }}
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: ${{ matrix.deb }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Show the packages
        run: |
          dpkg-deb --info dist/release/*.deb || true
          for appimage in dist/release/*.AppImage; do
            [ -f "$appimage" ] || continue
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux-riscv64:
    name: 3 · Linux riscv64
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GLIBC_FLOOR: "2.39"
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-riscv64
      - uses: storytold/craft-common-actions/actions/install-riscv64-cross@main
      - uses: storytold/craft-common-actions/actions/install-nfpm@main
      - name: Build and package (deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats "deb rpm tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

  # Phase 4. The Flatpak bundle and the Arch package are made from the Linux tarball.
  flatpak:
    name: 4 · Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    # The Linux builds passed. Written out: the implicit success() also looks at the jobs before
    # them, and Signing fails in a dry run (the `release` environment refuses it).
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.linux.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          # flatpak-builder needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          TARBALL: dist/linux/strix-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
        run: |
          test -f "$TARBALL" || { echo "::error::$TARBALL is missing from release-linux-${{ matrix.arch }}"; ls dist/linux; exit 1; }
          packaging/linux/flatpak-bundle.sh "$TARBALL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  arch:
    name: 4 · Arch Linux ${{ matrix.arch }}
    needs: [version, linux]
    # The Linux builds passed. Written out: the implicit success() also looks at the jobs before
    # them, and Signing fails in a dry run (the `release` environment refuses it).
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - uses: storytold/craft-common-actions/actions/arch-package@main
        with:
          tarball: dist/linux/strix-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch-${{ matrix.arch }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error

  web:
    name: 3 · Web (wasm)
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-web
      - uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Build and zip
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  # FreeBSD x86_64 in a VM: the app and the CLI, in a tar.gz with the licences and icons.
  freebsd:
    name: 3 · FreeBSD x86_64
    needs: [version, checks, signing]
    # After the preflight: the released code's CI passed (or a dry run), whatever Signing reported.
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      # craft-proof's Language data (spelling lists, hyphenation patterns): craft-i18n at the commit in
      # craft-i18n.rev (sets CRAFT_I18N_DIR and CRAFT_I18N_REQUIRED=1).
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Build and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          envs: "VERSION WORDCRAFT_BUILD_DATE WORDCRAFT_BUILD_SHA"
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            # The VM does not get GITHUB_ENV: craft-i18n (checked out above) is passed like craft-fonts.
            export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1 WORDCRAFT_VERSION="$VERSION"
            export CRAFT_I18N_DIR="$PWD/craft-i18n" CRAFT_I18N_REQUIRED=1
            cargo build --release --locked -p strix -p strix-cli
            name="strix-$VERSION-freebsd-x86_64"
            mkdir -p "dist/release/$name/icons"
            cp target/release/strix target/release/strix-cli "dist/release/$name/"
            cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/release/$name/"
            cp packaging/linux/io.github.nabre.strix.desktop "dist/release/$name/"
            cp -R assets/app-icon/hicolor "dist/release/$name/icons/" 2>/dev/null || true
            tar -C dist/release -czf "dist/release/$name.tar.gz" "$name"
            rm -rf "dist/release/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*.tar.gz
          if-no-files-found: error

  # Phase 5. The GitHub Release v<version>, published with every package and SHA256SUMS.txt once
  # every build has passed and the released code's CI too (the signing report never holds it back).
  # On the release branch only. Then the site is redeployed: a release published with GITHUB_TOKEN raises no
  # `release` event for site.yml, but a workflow_dispatch started here does run.
  release:
    name: 5 · Publish GitHub Release
    needs: [checks, version, signing, macos, windows, linux, linux-riscv64, flatpak, arch, web, freebsd]
    if: "!cancelled() && needs.version.outputs.publish == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # gh workflow run site.yml
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="v$VERSION"
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * >SHA256SUMS.txt
          ls -l
          # A draft left by the old flow (draft, then Publish release) is replaced: it holds no
          # tag, and the release below carries every package.
          if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            gh release delete "$tag" --repo "$repo" --yes
            echo "Replaced the draft $tag" >>"$GITHUB_STEP_SUMMARY"
          fi
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          gh release create "$tag" ./* --repo "$repo" --target "$SHA" \
            --title "Strix $tag" --generate-notes "${flags[@]}"
          echo "Published $(gh release view "$tag" --repo "$repo" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The site's download links and its web app (app/) come from the latest release.
      - name: Redeploy the site
        if: needs.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Started the site deploy (site.yml) for the new release" | tee -a "$GITHUB_STEP_SUMMARY"
