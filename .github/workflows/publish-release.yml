# Publishes the draft GitHub Release that release.yml made (docs/releasing.md): run it by hand
# (Actions › Publish release › Run workflow) once the draft has been checked. It then redeploys the
# site (site.yml), so https://nabre.github.io/strix/app/ serves the new web build: a release
# published with GITHUB_TOKEN raises no `release` event for other workflows, but a
# workflow_dispatch it starts does run. It also lists, as a warning, what main has that the
# release doesn't (merged after the release branch was built).
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (empty: Cargo.toml's)"
        type: string
        default: ""

permissions:
  contents: write
  # gh workflow run site.yml
  actions: write

jobs:
  publish:
    name: Publish the draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version, read once: the input, else Cargo.toml's [workspace.package] version.
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)}"
          [ -n "$version" ] || { echo "::error::no version: none given and none in Cargo.toml's [workspace.package]"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)" || { echo "::error::there is no release $tag: run Release first"; exit 1; }
          if [ "$draft" != "true" ]; then
            echo "$tag is already published"
          else
            gh release edit "$tag" --draft=false --latest
            echo "Published $(gh release view "$tag" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # A draft is built from the release branch when it was pushed: what main got afterwards
      # (merged pull requests) isn't in it. Said here, so it isn't a surprise in the app.
      - name: Check what main has that the release hasn't
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/v$VERSION...main" --jq '[.commits[] | select(.parents | length < 2)] | length')" || exit 0
          if [ "$ahead" -gt 0 ]; then
            echo "::warning::main has $ahead commit(s) that v$VERSION doesn't include: they go in the next release (bump the version, merge main into release)"
            {
              echo "### Not in v$VERSION"
              gh api "repos/$GITHUB_REPOSITORY/compare/v$VERSION...main" --jq '.commits[] | select(.parents | length < 2) | "- " + (.commit.message | split("\n")[0])'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      # The site's download links and its web app (app/) come from the latest release.
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Started the site deploy (site.yml) for the new release" | tee -a "$GITHUB_STEP_SUMMARY"
