# Publishes the draft GitHub Release that release.yml made (docs/releasing.md): run it by hand
# (Actions › Publish release › Run workflow) once the draft has been checked.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (empty: Cargo.toml's)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: Publish the draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)}"
          tag="v$version"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)" || { echo "::error::there is no release $tag: run Release first"; exit 1; }
          if [ "$draft" != "true" ]; then
            echo "$tag is already published"
            exit 0
          fi
          gh release edit "$tag" --draft=false --latest
          echo "Published $(gh release view "$tag" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
