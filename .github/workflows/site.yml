name: Site

# The project site on GitHub Pages: https://nabre.github.io/strix/. Built from site/ with the
# brand files of docs/brand by `cargo xtask site --check` (xtask/src/site.rs), with the web build
# of the latest release unpacked into app/ ("Try it in the browser"). Deployed with
# actions/deploy-pages: no gh-pages branch. The repository's Settings › Pages › Source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'assets/app-icon/**'
      - 'xtask/src/site.rs'
      # The version in the download links.
      - 'Cargo.toml'
      - '.github/workflows/site.yml'
  # A new release: new download links and a new web build in app/.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and check the site
        run: cargo xtask site --check
      # The browser version of the latest release, as published (packaging/web/package.sh): its
      # paths are relative, so it works under /strix/app/.
      - name: Add the web app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'strix-web-*.zip' --dir "$RUNNER_TEMP/web"
          unzip -q "$RUNNER_TEMP"/web/strix-web-*.zip -d "$RUNNER_TEMP/web"
          dir=$(find "$RUNNER_TEMP/web" -mindepth 1 -maxdepth 1 -type d -name 'strix-web-*' | head -n 1)
          test -f "$dir/index.html"
          mkdir -p _site/app
          cp -R "$dir/." _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
