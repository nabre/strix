name: Site

# The project site on GitHub Pages: https://nabre.github.io/strix/. Built from site/ with the
# brand files of docs/brand by `cargo xtask site --check` (xtask/src/site.rs), with the web build
# of the latest release (or of this commit, if no release has one) unpacked into app/. Deployed with
# actions/deploy-pages: no gh-pages branch. The repository's Settings › Pages › Source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'assets/app-icon/**'
      - 'xtask/src/site.rs'
      # The version in the download links.
      - 'Cargo.toml'
      - '.github/workflows/site.yml'
  # A new release: new download links and a new web build in app/. A release published by hand on
  # GitHub raises this event; one published by publish-release.yml (GITHUB_TOKEN) doesn't, so
  # that workflow starts this one through workflow_dispatch.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and check the site
        run: cargo xtask site --check
      # app/ ("Try it in the browser") is the browser version of the newest published release that
      # has one (packaging/web/package.sh); its paths are relative, so it works under /strix/app/.
      # Older releases (and ones made by hand) carry no strix-web zip: with none at all, the web
      # app is built here from this commit, the same way release.yml builds it.
      - name: Find the web app release
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name | test("^strix-web-.*\\.zip$")))][0].tag_name // empty')
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Web app from release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'strix-web-*.zip' --dir "$RUNNER_TEMP/web"
          else
            echo "::notice::no published release has a strix-web zip: building the web app from ${GITHUB_SHA::7}"
            echo "Web app built from ${GITHUB_SHA::7} (no release has one)" >>"$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.web.outputs.tag == ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83 # CRAFT_FONTS_REF in release.yml
      - if: steps.web.outputs.tag == ''
        run: rustup target add wasm32-unknown-unknown
      - if: steps.web.outputs.tag == ''
        uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Build the web app
        if: steps.web.outputs.tag == ''
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          STRIX_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STRIX_BUILD_DATE=$(date -u +%F) DIST="$RUNNER_TEMP/web" packaging/web/package.sh
      - name: Add the web app
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP"/web/strix-web-*.zip -d "$RUNNER_TEMP/web"
          dir=$(find "$RUNNER_TEMP/web" -mindepth 1 -maxdepth 1 -type d -name 'strix-web-*' | head -n 1)
          test -f "$dir/index.html"
          mkdir -p _site/app
          cp -R "$dir/." _site/app/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
