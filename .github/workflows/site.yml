name: Site

# The project site on GitHub Pages: https://nabre.github.io/strix/. Built from site/ with the
# brand files of docs/brand by `cargo xtask site --check` (xtask/src/site.rs), with the download
# links and the web build (app/) of the latest published release (the web app is built from its
# tag when the release has none). Deployed with actions/deploy-pages: no gh-pages branch. The
# repository's Settings › Pages › Source must be "GitHub Actions".
#
# Always deployed from main: the github-pages environment refuses tags ("Tag v0.17.0 is not
# allowed to deploy to github-pages"), so a release published on GitHub doesn't deploy from its
# tag but starts this workflow again on main (job "On main"). One published by
# publish-release.yml starts it on main itself (GITHUB_TOKEN raises no `release` event).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'assets/app-icon/**'
      - 'xtask/src/site.rs'
      - '.github/workflows/site.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'release' && 'release' || 'deploy' }}
  cancel-in-progress: false

jobs:
  # A release published on GitHub: deploy again from main (a tag may not deploy to Pages).
  redispatch:
    name: On main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Release $TAG published: started the site deploy on main" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # app/ ("Try it in the browser") is the browser version of the latest release
      # (packaging/web/package.sh); its paths are relative, so it works under /strix/app/. A release
      # made by release.yml carries it as strix-web-<version>.zip. One made by hand on GitHub has
      # no assets: then the web app is built here from that release's tag, with the tag's version
      # (what Help › About shows), the same way release.yml builds it.
      - name: Find the latest release
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The latest published release (drafts and pre-releases aren't "latest").
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || {
            echo "::error::no published release: publish one first (docs/releasing.md)"
            exit 1
          }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'strix-web-*.zip' --dir "$RUNNER_TEMP/web"; then
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "Web app: strix-web zip of release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
            echo "::notice::release $tag has no strix-web zip: building the web app from its tag"
            echo "Web app: built from the tag $tag (the release has no strix-web zip)" >>"$GITHUB_STEP_SUMMARY"
          fi
      # Download links to the latest release, not to a version bumped on main but not released.
      - name: Build and check the site
        env:
          VERSION: ${{ steps.web.outputs.version }}
        run: |
          cargo xtask site --check --version "$VERSION"
          echo "Site: download links to v$VERSION" >>"$GITHUB_STEP_SUMMARY"
      - if: steps.web.outputs.build == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.web.outputs.tag }}
          path: web-src
      - if: steps.web.outputs.build == 'true'
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83 # CRAFT_FONTS_REF in release.yml
      - if: steps.web.outputs.build == 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.web.outputs.build == 'true'
        uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Build the web app
        if: steps.web.outputs.build == 'true'
        working-directory: web-src
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          VERSION: ${{ steps.web.outputs.version }}
        run: |
          set -euo pipefail
          # A tag made by hand may not match its Cargo.toml: the release's version wins.
          cargo xtask version set "$VERSION"
          STRIX_VERSION="$VERSION" STRIX_BUILD_SHA="$(git rev-parse HEAD)" DIST="$RUNNER_TEMP/web" packaging/web/package.sh
      - name: Add the web app
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP"/web/strix-web-*.zip -d "$RUNNER_TEMP/web"
          dir=$(find "$RUNNER_TEMP/web" -mindepth 1 -maxdepth 1 -type d -name 'strix-web-*' | head -n 1)
          test -f "$dir/index.html"
          mkdir -p _site/app
          cp -R "$dir/." _site/app/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
