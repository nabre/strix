# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: PdfCraft saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# Nightly on main (dependency and runner-image drift shows up within a day) and on PRs that change
# the Windows packaging itself. A release doesn't run it again: release.yml builds the ARM64 MSI
# itself and reports this workflow's last run on main (job "Checks already run").
on:
  schedule:
    - cron: "13 6 * * *"
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Immutable supporting workflow revision until the new install contract lands upstream.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@293de72429d3ed5d9fa92aded5e500544c0fa28f
    with:
      app-name: strix
      app-dir: Strix
      install-relative-path: Programs/ArtCraft/Strix
      install-scope: perUser
