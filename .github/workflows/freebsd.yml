# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

# The VM build is slow, so it runs nightly on main, not on every pull request: a drifted dependency
# still shows up within a day. PRs that change the FreeBSD workflow or packaging itself still run
# it. A release doesn't run it again: release.yml builds the FreeBSD package in its own VM and
# reports this workflow's last run on main (job "Checks already run").
on:
  pull_request:
    # ready_for_review: a draft's checks run when it is marked ready (pr-scope.yml).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/freebsd.yml
      - packaging/env.sh
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A draft PR: not run (pr-scope.yml).
  scope:
    uses: ./.github/workflows/pr-scope.yml
    permissions:
      contents: read
      pull-requests: read

  freebsd:
    needs: [scope]
    if: needs.scope.outputs.run != 'false'
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
