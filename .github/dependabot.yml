version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Minor and patch updates share one PR. A breaking bump gets its own PR so one API change
    # doesn't hold the safe updates back (#2973). For cargo, Dependabot counts a 0.y bump of a
    # 0.x crate as major, as Cargo does. A dependency goes to the first group it matches, so the
    # crate families that must move together come before the catch-all.
    groups:
      egui:
        patterns:
          - "egui"
          - "egui_*"
          - "eframe"
          - "winit"
      fonts:
        patterns:
          - "skrifa"
          - "harfrust"
      hayro:
        patterns:
          - "hayro-*"
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    # Major API changes in these follow upstream WordCraft (docs/upstream.md): adapting its code
    # here would conflict at every upstream merge until upstream moves too.
    ignore:
      - dependency-name: "harfrust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "skrifa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "quick-xml"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "vello_cpu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "hayro-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
