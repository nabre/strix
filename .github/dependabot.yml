# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    # Major API changes in these follow upstream WordCraft (docs/upstream.md): adapting its code
    # here would conflict at every upstream merge until upstream moves too.
    ignore:
      - dependency-name: "harfrust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "skrifa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "quick-xml"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "vello_cpu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "hayro-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
