[package]
name = "strix-dictionaries"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strix spelling dictionaries and thesauri on demand: which public Hunspell dictionary each proofing language reads and which MyThes thesaurus the Thesaurus reads, downloaded into the user's dictionaries folder"

[lints]
workspace = true

[dependencies]
wordcraft-proof = { workspace = true }
wordcraft-control-key = { workspace = true }
# A thesaurus names its encoding (ISO 8859, KOI8-R, Windows code pages): already the workspace's.
encoding_rs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The same ureq build craft-update already uses (no new crates): rustls with ring, the OS's
# certificate verifier.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
