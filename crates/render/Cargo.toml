# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
[package]
name = "strix-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strix rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
strix-geom = { workspace = true, features = ["image"] }
strix-doc = { workspace = true }
strix-fonts = { workspace = true }
strix-layout = { workspace = true }
strix-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
