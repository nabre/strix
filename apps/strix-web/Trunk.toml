# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
# Build with: trunk build --release   (from apps/strix-web)
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8771

[watch]
# The whole workspace (the app's code is mostly in ../../crates, plus locales and assets),
# without the build outputs, which would otherwise rebuild in a loop.
watch = ["../.."]
ignore = ["../../target", "../../dist", "../../.git", "../../plan"]
