# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
[package]
name = "strix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "strix-cli"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
# VERSIONINFO for strix-cli.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

[dev-dependencies]
wordcraft-fonts = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
