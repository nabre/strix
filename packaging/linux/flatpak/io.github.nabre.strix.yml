# Modified by the Strix contributors (fork of WordCraft); see NOTICE.
# Flatpak manifest for Strix, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.nabre.strix.yml
#   flatpak run io.github.nabre.strix
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles come from io.github.nabre.strix.bundle.yml instead (see there);
# keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.nabre.strix
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: strix
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Network: update checks reach GitHub. Shared host network namespace, so the optional
  # --control server's 127.0.0.1 listener is reachable from the host as well.
  - --share=network
  # Deliberately not granted: home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: strix
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/strix/cargo
        CARGO_NET_OFFLINE: 'true'
        # The interface translations (this repository's locales/) must be embedded by build.rs.
        CRAFT_I18N_REQUIRED: '1'
    build-commands:
      - cargo --offline build --release --locked -p strix -p strix-cli
      - install -Dm755 target/release/strix /app/bin/strix
      - install -Dm644 NOTICE /app/share/doc/strix/NOTICE
      - install -Dm755 target/release/strix-cli /app/bin/strix-cli
      - install -Dm644 packaging/linux/io.github.nabre.strix.desktop /app/share/applications/io.github.nabre.strix.desktop
      - install -Dm644 packaging/linux/io.github.nabre.strix.mime.xml /app/share/mime/packages/io.github.nabre.strix.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.nabre.strix.metainfo.xml.in > /app/share/metainfo/io.github.nabre.strix.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
